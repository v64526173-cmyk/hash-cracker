[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hashcracker"
version = "1.0.0"
description = "Educational multiprocessing hash-cracking toolkit (MD5/SHA1/SHA256) with dictionary, brute-force, and salted-hash attacks."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Your Name" }]
keywords = ["security", "cybersecurity", "hashing", "pentesting", "cracking", "ctf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/hash-cracker"
Issues = "https://github.com/YOUR_USERNAME/hash-cracker/issues"

[project.scripts]
hashcracker = "hashcracker.cli:main"

[tool.setuptools.packages.find]
include = ["hashcracker*"]
