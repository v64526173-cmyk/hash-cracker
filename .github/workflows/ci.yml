name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest tests/ -v

      - name: Smoke-test the CLI
        run: |
          python -m hashcracker hash --text "password123" --algorithm sha256
          HASH=$(python -m hashcracker hash --text "sunshine" --algorithm sha256)
          python -m hashcracker crack --algorithm sha256 --hash "$HASH" \
            --wordlist wordlists/sample_wordlist.txt

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8 (errors only, style is advisory)
        run: flake8 hashcracker tests --count --select=E9,F63,F7,F82 --show-source --statistics
